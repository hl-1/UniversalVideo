server {
    listen 80;
    server_name xianyue.huanliyu.cn;

    return 301 https://xianyue.huanliyu.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name xianyue.huanliyu.cn;

    ssl_certificate /etc/nginx/certs/xianyue.huanliyu.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/xianyue.huanliyu.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;

    # Docker embedded DNS: re-resolve the application after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $videodream_upstream videodream-app:8001;

    location / {
        proxy_pass http://$videodream_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
